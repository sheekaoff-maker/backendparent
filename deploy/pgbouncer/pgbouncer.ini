; PgBouncer in transaction pooling mode — sits between N backend replicas
; and Postgres so each replica no longer needs its own connection_limit
; open directly against Postgres. Recommended once you're running more than
; 1-2 backend replicas (see the connection_limit comment in .env.example).
;
; Fill in <POSTGRES_HOST> / <POSTGRES_DB> for your environment. Real
; credentials belong in userlist.txt (gitignored), never here.

[databases]
parental_control = host=<POSTGRES_HOST> port=5432 dbname=<POSTGRES_DB>

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction mode: a client "holds" a real Postgres connection only for the
; duration of one transaction, not the whole session — this is what lets a
; small pool of real Postgres connections serve many more app-level
; connections than 1:1 pooling could. Prisma requires `pgbouncer=true` on
; DATABASE_URL when pointed at this mode (see .env.example) because prepared
; statements can't be assumed to survive across transactions here.
pool_mode = transaction

; Total real connections PgBouncer is allowed to open against Postgres.
; Keep comfortably under Postgres's own max_connections (default 100) to
; leave headroom for migrations, health checks, and direct psql access.
default_pool_size = 20
max_client_conn = 1000
reserve_pool_size = 5
reserve_pool_timeout = 3

; Close connections that have been idle inside a transaction too long —
; protects against a buggy/hung client holding a real Postgres connection
; open indefinitely.
server_idle_timeout = 600
query_wait_timeout = 30

admin_users = postgres
stats_users = postgres
