# GuardTime production reverse proxy — terminates TLS, applies edge security
# headers/rate limiting, and forwards to the backend (NestJS on :3000).
#
# Placeholders to fill in for your environment:
#   <API_DOMAIN>        e.g. api.waqti.pro
#   <CERT_FULLCHAIN>     path to fullchain.pem (e.g. from certbot)
#   <CERT_PRIVKEY>       path to privkey.pem
#   <INTERNAL_CIDR>      the private network the DNS service and Prometheus
#                        scraper run on (e.g. 10.0.0.0/24, or 127.0.0.1/32
#                        if backend + dns-service are co-located on one VPS)

# --- Rate limiting zones (edge-level, in front of the app's own Throttler) ---
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# --- Plain HTTP: redirect everything to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name <API_DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
# HTTP/3 (QUIC) is commented out by default: it requires nginx built with
# --with-http_v3_module (not in most distro packages — e.g. Ubuntu's stock
# nginx lacks it as of this writing). Uncomment the two `quic`/`Alt-Svc`
# lines only after confirming `nginx -V` lists http_v3_module.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # listen 443 quic reuseport;
    # listen [::]:443 quic reuseport;
    http2 on;
    # http3 on;
    server_name <API_DOMAIN>;
    # add_header Alt-Svc 'h3=":443"; ma=86400' always;

    ssl_certificate     <CERT_FULLCHAIN>;
    ssl_certificate_key <CERT_PRIVKEY>;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers (defense in depth; helmet() sets most of these
    # app-side too — this covers static/error responses the app never sees) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    client_max_body_size 2m;
    limit_conn conn_limit 40;

    # --- Internal-only: Prometheus scrape target. Exposes route latency,
    # memory/CPU — must never be reachable from the public internet. ---
    location /metrics {
        allow <INTERNAL_CIDR>;
        deny all;
        proxy_pass http://127.0.0.1:3000/metrics;
        proxy_set_header Host $host;
    }

    # --- Internal-only: called exclusively by the co-located DNS service on
    # every query. Public exposure = unauthenticated DoS surface (flagged in
    # the 2026-07-17 production-readiness audit — this closes it). ---
    location /dns/policy/check {
        allow <INTERNAL_CIDR>;
        deny all;
        proxy_pass http://127.0.0.1:3000/dns/policy/check;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Internal-only: called exclusively by the co-located DNS service
    # when it resolves a `<token>.pair.guardtime.local` probe query (device
    # pairing + IP auto-repair beacon). Same trust boundary and rationale as
    # /dns/policy/check above — never expose publicly. ---
    location /dns/pair/confirm {
        allow <INTERNAL_CIDR>;
        deny all;
        proxy_pass http://127.0.0.1:3000/dns/pair/confirm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Auth endpoints: tighter edge rate limit ahead of the app's own
    # per-route Throttler (5/min login, 10/min register) ---
    location ~ ^/auth/(login|register) {
        limit_req zone=api_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # --- Everything else ---
    location / {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
